<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raven Shorts 1 — animatic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif&family=Roboto:wght@400&display=swap" rel="stylesheet">
<style>
  :root{ --ui:#d8dadd; --uibg:rgba(14,16,15,.88); --uiline:rgba(255,255,255,.16); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}

  #wrap{position:fixed;inset:0;overflow:hidden;background:#000}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;will-change:transform}
  #stage svg{display:block;width:1920px;height:1080px}

  .scene{opacity:0;visibility:hidden}
  .scene.on{visibility:visible}

  /* Stand-in captions live INSIDE the frame — see YTCAP. */
  #ytcap{opacity:0;transition:opacity .15s}
  body.nosubs #ytcap{display:none}

  #bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
    z-index:9;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
    max-width:calc(100vw - 20px);padding:9px 12px;background:var(--uibg);border:1px solid var(--uiline);
    border-radius:12px;color:var(--ui);font-size:13px;backdrop-filter:blur(8px)}
  body.clean #bar{display:none}
  #bar button,#bar select{font:inherit;font-family:inherit;color:var(--ui);background:transparent;
    border:1px solid var(--uiline);border-radius:8px;padding:5px 11px;cursor:pointer}
  #bar button:hover,#bar select:hover{border-color:rgba(255,255,255,.4)}
  #bar input[type=range]{width:min(44vw,420px);accent-color:#c7d0be}
  #tc{font-family:"IBM Plex Mono",monospace;font-size:12px;min-width:94px;text-align:center;opacity:.85}
  #names{font-size:12px;opacity:.6;min-width:180px;text-align:center}
  .hint{font-size:11px;opacity:.5;width:100%;text-align:center}
  @media (max-width:760px){ #names{display:none} .hint{display:none} #bar{gap:7px;padding:7px 9px} }
</style>
</head>

<div id="wrap">

    <svg id="svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision"></svg>
  </div>
</div>

<div id="bar">
  <button id="play">Play</button>

  <select id="spd"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option></select>
  <button id="subsb">Subs</button>
  <button id="cleanb">Clean</button>
  <span id="names"></span>

</div>

/* ===================== easing & helpers ===================== */
const cl  = (v,a,b)=> v<a?a : v>b?b : v;
const seg = (t,s,d)=> d<=0 ? (t>=s?1:0) : cl((t-s)/d,0,1);
const eo  = p => p<=0?0 : p>=1?1 : 1-Math.pow(2,-9*p);
const eio = p => p<=0?0 : p>=1?1 : (p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2);
const E   = (t,s,d)=> eo(seg(t,s,d));
const EI  = (t,s,d)=> eio(seg(t,s,d));
const lerp= (a,b,p)=> a+(b-a)*p;

const col = k => (k && C[k]) ? C[k] : (k||'none');

function mk(tag, attrs){
  const n = document.createElementNS(NS, tag);
  if(attrs) for(const k in attrs){ if(attrs[k]!=null) n.setAttribute(k, attrs[k]); }
  return n;
}
const ANCHOR   = { left:'start', center:'middle', right:'end' };
const BASELINE = { top:'text-before-edge', middle:'central', bottom:'text-after-edge' };
const FACE = {
  sans:  `"${FF.sans.family}",system-ui,sans-serif`,
  mono:  `"${FF.mono.family}",ui-monospace,monospace`,
  serif: `"${FF.serif.family}",Georgia,serif`
};
function applyType(el, styleKey){
  const s = TY[styleKey]; if(!s) return;
  el.setAttribute('font-size', s.size);
  el.setAttribute('font-weight', s.weight);
  el.setAttribute('fill', col(s.color));
  el.setAttribute('font-family', FACE[s.face] || FACE.sans);
  if(s.letterSpacing) el.setAttribute('letter-spacing', s.letterSpacing);
}

/* arrowheads are declared on the line, not drawn as paths */
(function defs(){

      orient:'auto-start-reverse', markerUnits:'userSpaceOnUse' });
    m.appendChild(mk('path',{ d:`M 0 0 L ${AH.w} ${AH.h/2} L 0 ${AH.h}`,
      fill:'none', stroke:col(key), 'stroke-width':1.5,
      'stroke-linecap':'round','stroke-linejoin':'round' }));

  }

})();

function node(n){
  if(n.type==='rect'){
    const e = mk('rect',{ x:n.x, y:n.y, width:n.w, height:n.h, rx:n.r||0,
      fill: n.fill==='none' ? 'none' : col(n.fill) });
    if(n.stroke){ e.setAttribute('stroke', col(n.stroke)); e.setAttribute('stroke-width', n.strokeWidth||1); }
    if(n.opacity!=null) e.setAttribute('opacity', n.opacity);
    return e;
  }
  if(n.type==='line'){
    const e = mk('line',{ x1:n.x1, y1:n.y1, x2:n.x2, y2:n.y2,
      stroke: col(n.stroke), 'stroke-width': n.strokeWidth||1 });
    if(n.arrow==='end')   e.setAttribute('marker-end',   `url(#ah-${n.stroke})`);
    if(n.arrow==='start') e.setAttribute('marker-start', `url(#ah-${n.stroke})`);
    return e;
  }
  if(n.type==='path'){
    const e = mk('path',{ d:n.d, fill: (!n.fill||n.fill==='none') ? 'none' : col(n.fill),
      stroke: n.stroke?col(n.stroke):null, 'stroke-width': n.strokeWidth||0,
      'stroke-linecap':'round','stroke-linejoin':'round' });
    if(n.opacity!=null) e.setAttribute('opacity', n.opacity);
    return e;
  }
  if(n.type==='text'){
    const e = mk('text',{ x:n.x, y:n.y,
      'text-anchor': ANCHOR[n.align]||'start',
      'dominant-baseline': BASELINE[n.baseline]||'text-before-edge' });
    applyType(e, n.style);
    e.textContent = n.value==null ? '' : n.value;
    return e;
  }
  if(n.type==='image' && n.ref==='bird'){
    const g  = mk('g');
    const vb = SPEC.bird.viewBox.split(/\s+/).map(Number);
    g.setAttribute('transform',
      `translate(${n.x} ${n.y}) scale(${n.w/vb[2]} ${n.h/vb[3]}) translate(${-vb[0]} ${-vb[1]})`);
    g.appendChild(mk('path',{ d: SPEC.bird.d, fill: col(n.fill) }));
    if(n.opacity!=null) g.setAttribute('opacity', n.opacity);
    return g;
  }
  return mk('g');
}

const F = id => SPEC.frames.find(f=>f.id===id);

function sceneG(frame){
  const g = mk('g',{class:'scene'});
  g.appendChild(mk('rect',{x:0,y:0,width:1920,height:1080,fill:col(frame.bg)}));
  svg.appendChild(g);
  return g;
}
function op(el,v){ el.style.opacity = v; }
function tr(el,s){ el.setAttribute('transform', s); }
function dash(el, p){
  if(el.__len==null){ try{ el.__len = el.getTotalLength(); }catch(e){ el.__len = 0; } }
  const L = el.__len || 0;
  el.setAttribute('stroke-dasharray', L);
  el.setAttribute('stroke-dashoffset', L*(1-p));
}
function typeInto(el, full, p){ el.textContent = full.slice(0, Math.round(full.length*p)); }

/* colour interpolation, for the panel stepping back and forward again */
function hex2rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function mixCol(a, b, p){
  const A=hex2rgb(col(a)), B=hex2rgb(col(b));
  return `rgb(${Math.round(lerp(A[0],B[0],p))},${Math.round(lerp(A[1],B[1],p))},${Math.round(lerp(A[2],B[2],p))})`;
}

(function(){

  SC['02'] = { g, inner, arcs, sources, nodeDot, squareG, sqSpec, bird, wordmark, sub,
               lineL, lineR, labL, labR, railG, bar, leadChev, dots, items, chevs,
               underline, agentG, R, itemWidth, layout:()=>{ if(!laid) layoutRail(); } };

    el.__bright = TY[styleKey].color;
    el.__dim    = TY[DIM[styleKey]] ? TY[DIM[styleKey]].color : TY[styleKey].color;
  }
  tinted(eyebrow,'panelEyebrow'); tinted(title,'panelTitle');
  T.cells.forEach(c=>{
    if(c.value==null || !c.style) return;
    const cc=colOf[c.col], rr=rowOf[c.row]; if(!cc||!rr) return;
    const x = c.align==='left' ? cc.x : (c.align==='center' ? cc.anchorX : cc.anchorX);
    const e = mk('text',{ x, y: rr.y + rr.h/2,
      'text-anchor':ANCHOR[c.align]||'start', 'dominant-baseline':'central' });
    applyType(e, c.style); e.textContent = c.value;
    tinted(e, c.style);
    moving.appendChild(e);
    (byRow[c.row] = byRow[c.row]||[]).push(e);
  });

  // SOURCES row — authored at the 03c position, so pull it back by SHIFT
  const srcEyebrow = node(Object.assign({}, f3c.nodes.find(n=>n.style==='sourcesEyebrow'), {}));
  srcEyebrow.setAttribute('x', Number(f3c.nodes.find(n=>n.style==='sourcesEyebrow').x) - SHIFT);
  moving.appendChild(srcEyebrow);
  const pills = f3c.sourcePills.map(p=>{
    const pg = mk('g');
    pg.appendChild(mk('rect',{ x:p.x - SHIFT, y:p.y, width:p.w, height:p.h, rx:p.r,
      fill: p.fill==='none'?'none':col(p.fill), stroke:col(p.stroke), 'stroke-width':p.strokeWidth }));
    const t = mk('text',{ x:p.textX - SHIFT, y:p.textY, 'text-anchor':'start','dominant-baseline':'central' });
    applyType(t, p.style); t.textContent = p.label;
    pg.appendChild(t); moving.appendChild(pg);
    return pg;
  });

  /* document card — enters from the left, outside the moving group */
  const D = f3c.docCard;
  const docG = mk('g'); inner.appendChild(docG);
  docG.appendChild(mk('rect',{ x:D.card.x, y:D.card.y, width:D.card.w, height:D.card.h, rx:D.card.r,
    fill:col(D.card.fill), stroke:col(D.card.stroke), 'stroke-width':D.card.strokeWidth }));
  const docIcon = mk('path',{ d:D.icon.d, fill:'none', stroke:col(D.icon.stroke),
    'stroke-width':D.icon.strokeWidth, 'stroke-linecap':'round','stroke-linejoin':'round' });
  docG.appendChild(docIcon);
  const docTitle = node(Object.assign({type:'text'}, D.title)); docG.appendChild(docTitle);
  const docPages = node(Object.assign({type:'text'}, D.pages)); docG.appendChild(docPages);
  const docLines = D.lines.map(l=>{
    const e = mk('rect',{ x:l.x, y:l.y, width:l.w, height:l.h, fill:col(l.fill) });
    docG.appendChild(e); return e;
  });

  SC['03'] = { g, inner, moving, SHIFT, queryG, queryT, queryFull:q[2].value, checkG,
               cardG, eyebrow, title, rule, band, byRow,
               srcEyebrow, pills, docG, docIcon, docTitle, docPages, docLines };
})();

/* ---------------- scene 04 ---------------- */
(function(){
  const f = F('04'), g = sceneG(f);
  const inner = mk('g',{class:'inner'}); g.appendChild(inner);
  const rays = f.nodes.filter(n=>n.type==='path').map(n=>{ const e=node(n); inner.appendChild(e); return e; });
  const lineSpec = f.nodes.find(n=>n.style==='closingLine');
  const lineG = mk('g'); const lineT = node(lineSpec); lineG.appendChild(lineT); inner.appendChild(lineG);
  const mark = node(f.nodes.find(n=>n.style==='closingWordmark')); inner.appendChild(mark);
  const black = mk('rect',{x:0,y:0,width:1920,height:1080,fill:'#000',opacity:0}); g.appendChild(black);
  SC['04'] = { g, inner, rays, lineG, lineT, mark, black };
})();

/* ===================== caption layer ===================== */
const CAPL = (function(){
  const g = mk('g',{ id:'ytcap' }); svg.appendChild(g);
  const lines = [];
  for(let i=0;i<YTCAP.maxLines;i++){
    const box = mk('rect',{ rx:3, fill:YTCAP.bg });
    const t   = mk('text',{ 'text-anchor':'middle','dominant-baseline':'central',
      'font-family':'Roboto,Arial,Helvetica,sans-serif','font-size':YTCAP.fontSize,
      'font-weight':400, fill:'#ffffff' });
    g.appendChild(box); g.appendChild(t); lines.push({box,t});
  }
  const probe = mk('text',{ 'font-family':'Roboto,Arial,Helvetica,sans-serif',
    'font-size':YTCAP.fontSize, visibility:'hidden' });
  svg.appendChild(probe);
  const wcache = {};
  function width(s){
    if(wcache[s]!=null) return wcache[s];
    probe.textContent = s;
    return (wcache[s] = probe.getComputedTextLength());
  }
  function wrapAt(text, maxW){
    const words = text.split(/\s+/), out = []; let cur = '';
    for(const w of words){
      const next = cur ? cur+' '+w : w;
      if(cur && width(next) > maxW){ out.push(cur); cur = w; } else cur = next;
    }
    if(cur) out.push(cur);
    return out;
  }
  function wrap(text){
    let first = null;
    for(const f of [1,0.90,0.82,0.74,0.66]){
      const ls = wrapAt(text, YTCAP.maxWidth*f);
      if(!first) first = ls;
      if(ls.length % YTCAP.maxLines === 0) return ls;
    }
    return first;
  }
  let CAPS = null;
  function build(){
    CAPS = [];
    CUES.forEach(([t0,t1,text])=>{
      const ls = wrap(text), groups = [];
      for(let i=0;i<ls.length;i+=YTCAP.maxLines) groups.push(ls.slice(i,i+YTCAP.maxLines));
      const d = (t1-t0)/groups.length;
      groups.forEach((grp,i)=> CAPS.push([t0+i*d, t0+(i+1)*d, grp]));
    });
  }
  function show(t){
    if(!CAPS) build();
    const c = CAPS.find(x=> t>=x[0] && t<x[1]);
    if(!c){ g.style.opacity = 0; return; }
    g.style.opacity = 1;
    const grp = c[2], lh = YTCAP.fontSize*YTCAP.lineGap;
    lines.forEach((ln,i)=>{
      const str = grp[i];
      if(str==null){ ln.box.setAttribute('opacity',0); ln.t.setAttribute('opacity',0); return; }
      ln.box.setAttribute('opacity',1); ln.t.setAttribute('opacity',1);
      const cy = YTCAP.blockBottom - (grp.length-1-i)*lh - lh/2;
      const w = width(str);
      ln.t.setAttribute('x',960); ln.t.setAttribute('y',cy); ln.t.textContent = str;
      ln.box.setAttribute('x', 960 - w/2 - YTCAP.pad.x);
      ln.box.setAttribute('y', cy - lh/2 + 1);
      ln.box.setAttribute('width',  w + YTCAP.pad.x*2);
      ln.box.setAttribute('height', lh - 2);
    });
  }
  return { show, build };
})();

/* ===================== per-scene animation ===================== */
const ANIM = {

  '01'(lt, dur){
    const s = SC['01'];
    const a = EI(lt, B01.arc, 1.6);
    dash(s.arc, a); op(s.arc, a>0?1:0);
    op(s.bird, E(lt, B01.bird, 1.0));
    op(s.mark, E(lt, B01.wordmark, 0.8));
    const r = EI(lt, B01.rule, 0.6);
    const cx = s.r0.x + s.r0.w/2;
    tr(s.ruleG, `translate(${cx} 0) scale(${r} 1) translate(${-cx} 0)`);
    op(s.ruleG, r>0?1:0);
    const k = lerp(1.05, 1.0, EI(lt, 0, 3.0));
    tr(s.inner, `translate(960 540) scale(${k}) translate(-960 -540)`);
  },

  '02'(lt, dur){
    const s = SC['02']; s.layout();
    const R = s.R;

    s.sources.forEach((g,i)=>{
      const p = E(lt, B02.source.start + i*B02.source.step, B02.source.dur);
      op(g, p); tr(g, `translate(0 ${lerp(-12,0,p)})`);
    });

    s.arcs.forEach((e,i)=>{
      const k = EI(lt, B02.arc.start + i*B02.arc.step, B02.arc.dur);
      dash(e, k); op(e, k>0?1:0);
    });
    op(s.nodeDot, E(lt, B02.node, 0.4));

    const sq = EI(lt, B02.square, 0.75);
    const cx = s.sqSpec.x + s.sqSpec.w/2, cy = s.sqSpec.y + s.sqSpec.h/2;
    tr(s.squareG, `translate(${cx} ${cy}) scale(${lerp(0.9,1,sq)}) translate(${-cx} ${-cy})`);
    op(s.squareG, sq);
    op(s.bird,     E(lt, B02.bird, 0.6));
    op(s.wordmark, E(lt, B02.wordmark, 0.55));
    op(s.sub,      E(lt, B02.sub, 0.5));

    const dl = EI(lt, B02.exit.line, B02.exit.dur);
    dash(s.lineL, dl); op(s.lineL, dl>0?1:0);
    dash(s.lineR, dl); op(s.lineR, dl>0?1:0);
    op(s.labL, E(lt, B02.exit.label, 0.5));
    op(s.labR, E(lt, B02.exit.label, 0.5));

    /* ---- the rail: stationary breadcrumb, the active step walks it ---- */
    const barIn = E(lt, B02.rail.bar, 0.6);
    op(s.railG, barIn);
    tr(s.railG, `translate(0 ${lerp(16,0,barIn)})`);

    op(s.agentG, E(lt, B02.rail.agent, 0.7));
    const dotsIn = E(lt, B02.rail.dots, 0.5);
    op(s.leadChev, dotsIn);
    s.dots.forEach(d=>{ d.style.opacity = dotsIn; });
    s.chevs.forEach(c=>{ c.style.opacity = dotsIn; });
    s.items.forEach(t=>{ t.style.opacity = dotsIn; });

    /* Three states per step. The exported still is the dormant rail — every
       step in lineDark with only the Agent capsule lit — while the spec's
       tokens describe the active one. Both are used: steps sit dormant, the
       active step is white over a sage underline, and steps it has passed
       stay in muted, so the rail reads as a workflow running left to right. */
    const I = B02.rail.items;
    let active = -1;
    for(let i=0;i<s.items.length;i++) if(lt >= I.start + i*I.step) active = i;

    s.items.forEach((t,i)=>{
      t.style.opacity = 1;
      const state = i === active ? 'active' : (i < active ? 'done' : 'idle');
      const to = state==='active' ? TY[R.activeStyle].color
               : state==='done'   ? TY[R.itemStyle].color
               : 'lineDark';
      // ease the colour so a step does not snap on
      const k = state==='idle' ? 0 : EI(lt, I.start + Math.min(i,Math.max(active,0))*I.step, I.dur);
      t.setAttribute('fill', state==='idle' ? col('lineDark') : mixCol('lineDark', to, k));
    });
    s.dots.forEach((d,i)=>
      d.setAttribute('fill', col(i === active ? R.dot.activeFill : R.dot.fill)));

    if(active >= 0){
      const at = p => ({ x: R.dot.cx[p] - s.itemWidth(p)/2, w: s.itemWidth(p) });
      const a0 = at(Math.max(0, active-1)), a1 = at(active);
      const k  = EI(lt, I.start + active*I.step, I.dur);
      s.underline.setAttribute('x', lerp(a0.x, a1.x, k));
      s.underline.setAttribute('width', lerp(a0.w, a1.w, k));
      s.underline.style.opacity = E(lt, I.start, 0.4);
    } else {
      s.underline.style.opacity = 0;
    }
  },

  '03'(lt, dur){
    const s = SC['03'];

    /* 3a — the figure */
    op(s.cardG, E(lt, B03.card, 0.5));
    op(s.rule,  E(lt, B03.rule, 0.4));
    op(s.band,  E(lt, B03.band, 0.4));
    const show = (keys, at) => keys.forEach(k => (s.byRow[k]||[]).forEach(e=>{ e.style.opacity = E(lt, at, 0.4); }));
    op(s.eyebrow, E(lt, B03.eyebrow, 0.4));
    op(s.title,   E(lt, B03.title, 0.45));
    show(['caption'], B03.caption);
    show(['head'],    B03.heads);
    show(['pfadj'],   B03.figures);
    show(['netdebt'], B03.netdebt);

    /* 3b — the query, and the panel steps back */
    const qin = E(lt, B03.query, 0.55);
    op(s.queryG, qin); tr(s.queryG, `translate(0 ${lerp(-14,0,qin)})`);
    typeInto(s.queryT, s.queryFull, seg(lt, B03.typing, 0.9));
    op(s.checkG, E(lt, B03.check, 0.45));

    // dim on the question, brighten again when the source lands
    const dimP = EI(lt, B03.dim, 0.55) * (1 - EI(lt, B03.shift, 0.6));
    const paint = el => { if(el.__bright) el.setAttribute('fill', mixCol(el.__bright, el.__dim, dimP)); };
    paint(s.eyebrow); paint(s.title);
    for(const k in s.byRow) s.byRow[k].forEach(paint);

    /* 3c — the panel slides aside, the source comes in */
    const sh = EI(lt, B03.shift, 0.75);
    tr(s.moving, `translate(${s.SHIFT*sh} 0)`);

    const dc = EI(lt, B03.doc, 0.7);
    op(s.docG, dc);
    tr(s.docG, `translate(${lerp(-90,0,dc)} 0)`);
    op(s.docIcon,  E(lt, B03.doc+0.2, 0.4));
    op(s.docTitle, E(lt, B03.doc+0.3, 0.4));
    op(s.docPages, E(lt, B03.doc+0.4, 0.4));
    s.docLines.forEach((e,i)=>{
      e.style.opacity = E(lt, B03.docLines.start + i*B03.docLines.step, B03.docLines.dur);
    });

    op(s.srcEyebrow, E(lt, B03.sources, 0.45));
    s.pills.forEach((p,i)=> op(p, E(lt, B03.pills + i*0.14, 0.45)));
  },

  '04'(lt, dur){
    const s = SC['04'];
    s.rays.forEach((e,i)=>{
      const k = EI(lt, B04.lines.start + i*B04.lines.step, B04.lines.dur);
      dash(e, k); op(e, k>0?1:0);
    });
    const li = E(lt, B04.line, 0.9);
    op(s.lineG, li); tr(s.lineG, `translate(${lerp(-26,0,li)} 0)`);
    op(s.mark, E(lt, B04.wordmark, 0.6));
    s.black.setAttribute('opacity', seg(lt, B04.out, dur - B04.out));
  }
};

/* ===================== playback ===================== */
let T = 0, playing = false, last = 0;
const scrub = document.getElementById('scrub');
const tc = document.getElementById('tc');
const namesEl = document.getElementById('names');

/* Scenes are opaque and stacked in order, so a cross-dissolve is the
   incoming scene fading in ON TOP — fading both would dip to black. */
function sceneAlpha(sc, t){
  const x = TL.xfade, last = sc.t1 >= TL.total;
  if(t < sc.t0 - x) return 0;
  if(!last && t >= sc.t1) return 0;
  return sc.t0 === 0 ? 1 : cl((t - (sc.t0 - x)) / x, 0, 1);
}

function render(t){
  let active = null;
  TL.scenes.forEach(sc=>{
    const a = sceneAlpha(sc, t), g = SC[sc.id].g;
    if(a<=0){ g.classList.remove('on'); g.style.opacity = 0; return; }
    g.classList.add('on'); g.style.opacity = a;
    ANIM[sc.id](cl(t - sc.t0, 0, sc.t1 - sc.t0), sc.t1 - sc.t0);
    if(t>=sc.t0 && t<sc.t1) active = sc;
  });
  if(!active) active = TL.scenes[TL.scenes.length-1];
  namesEl.textContent = active.id + ' · ' + active.name;
  CAPL.show(t);
  tc.textContent = t.toFixed(2) + ' / ' + TL.total.toFixed(2);
  scrub.value = Math.round(t / TL.total * 1000);
}

function loop(ts){
  if(playing){
    if(!last) last = ts;
    T += (ts - last)/1000 * parseFloat(document.getElementById('spd').value);
    last = ts;
    if(T >= TL.total){ T = TL.total; playing = false; document.getElementById('play').textContent = 'Replay'; }
    render(T);
  } else last = 0;
  requestAnimationFrame(loop);
}
function setPlay(v){
  if(v && T >= TL.total) T = 0;
  playing = v; last = 0;
  document.getElementById('play').textContent = playing ? 'Pause' : (T>=TL.total ? 'Replay' : 'Play');
}
document.getElementById('play').onclick = ()=> setPlay(!playing);
scrub.oninput = e => { T = e.target.value/1000*TL.total; render(T); setPlay(false); };
document.getElementById('cleanb').onclick = ()=>{ document.body.classList.toggle('clean'); fit(); };
document.getElementById('subsb').onclick  = ()=>{ document.body.classList.toggle('nosubs'); };

addEventListener('keydown', e=>{
  const step = e.shiftKey ? 1 : 0.1;
  if(e.code==='Space'){ e.preventDefault(); setPlay(!playing); }
  else if(e.key==='ArrowRight'){ T = cl(T+step,0,TL.total); render(T); setPlay(false); }
  else if(e.key==='ArrowLeft'){  T = cl(T-step,0,TL.total); render(T); setPlay(false); }
  else if(e.key==='Home'){ T = 0; render(T); setPlay(false); }
  else if(e.key==='s'||e.key==='S'){ document.body.classList.toggle('nosubs'); }
  else if(e.key==='c'||e.key==='C'){ document.body.classList.toggle('clean'); fit(); }
  else if(e.key==='Escape'){ document.body.classList.remove('clean'); fit(); }
});

/* Fit the frame into the viewport, reserving a strip for the control
   bar. The captions are inside the frame, so nothing else is needed. */
const stage = document.getElementById('stage');
function fit(){
  const clean = document.body.classList.contains('clean');
  const barH  = clean ? 0 : (document.getElementById('bar').offsetHeight + 28);
  const avail = Math.max(120, innerHeight - barH);
  const k = Math.min(innerWidth/1920, avail/1080);
  stage.style.top = (avail/2) + 'px';
  stage.style.transform = `translate(-50%,-50%) scale(${k})`;
}
addEventListener('resize', fit);

function start(){ SC['02'].layout(); CAPL.build(); fit(); render(0); requestAnimationFrame(loop); }
if(document.fonts && document.fonts.ready) document.fonts.ready.then(start); else addEventListener('load', start);
</script>
