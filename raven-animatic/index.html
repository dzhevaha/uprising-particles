  return `rgb(${Math.round(lerp(A[0],B[0],p))},${Math.round(lerp(A[1],B[1],p))},${Math.round(lerp(A[2],B[2],p))})`;
}
const fmt = v => (v<0 ? '('+Math.abs(v).toFixed(1)+')' : v.toFixed(1));
const sgn = v => (v>0?'+':'') + v.toFixed(1);

/* ============================================================
   SHOTS 01 and 05 — the brand frames. Same construction, two
   different lock-ups: the name alone, then the name with the line.
   ============================================================ */
function brandScene(cfg, withTagline){
  const g = sceneG(DB.base);
  const inner = mk('g'); g.appendChild(inner);

  inner.appendChild(mk('rect',{x:0,y:0,width:1920,height:1080,fill:'url(#brandGlow)'}));

  const hy = cfg.horizon.y;
  const ground = mk('g');
  ground.appendChild(mk('ellipse',{cx:960,cy:hy+150,rx:1500,ry:230,fill:'url(#groundSheen)'}));
  ground.appendChild(mk('ellipse',{cx:960,cy:hy,rx:1150,ry:120,fill:'url(#horizonBloom)'}));
  ground.appendChild(mk('rect',{x:0,y:hy,width:1920,height:cfg.horizon.h,fill:'url(#horizonLine)'}));
  inner.appendChild(ground);

  const a = cfg.arc, r = a.r;
  const y0 = a.cy - Math.sqrt(Math.max(0, r*r - a.cx*a.cx));
  const arc = mk('path',{
    d:`M0 ${y0.toFixed(2)} A ${r} ${r} 0 0 1 1920 ${y0.toFixed(2)}`,
    fill:'none', stroke:DB.arcLight, 'stroke-width':a.strokeWidth, opacity:0.55 });
  inner.appendChild(arc);

  const markX = 960 - cfg.markW/2;
  const markG = bird(markX, cfg.markTop, cfg.markW, DB.ink);
  inner.appendChild(markG);

  /* Baselines measured off the reference frames: the export gives the
     lock-up's block offsets, not text baselines. */
  const w = cfg.wordmark;
  const wmY = cfg.markTop + cfg.markH + w.marginTop + w.size*1.011;
  const wm = txt('RAVEN',{ x:960 + w.size*0.15, y:wmY, fill:DB.ink, size:w.size,
    weight:400, anchor:'middle', track:w.tracking });
  inner.appendChild(wm);

  let tag = null;
  if(withTagline){
    const tg = cfg.tagline;
    tag = txt(tg.text,{ x:960, y:wmY + tg.marginTop + tg.size*1.66, fill:DB.muted,
      size:tg.size, anchor:'middle' });
    inner.appendChild(tag);
  }
  let foot = null;
  if(cfg.footnote){
    const f = cfg.footnote;
    foot = txt(f.text,{ x:f.x, y:f.y + f.size*0.96, fill:DB.muted, size:f.size });
    inner.appendChild(foot);
  }
  const black = mk('rect',{x:0,y:0,width:1920,height:1080,fill:'#000',opacity:0});
  g.appendChild(black);
  return { g, inner, ground, arc, markG, wm, tag, foot, black };
}

/* ===================== caption layer ===================== */
const CAPL = (function(){
  const g = mk('g',{ id:'ytcap' }); svg.appendChild(g);
  const lines = [];
  for(let i=0;i<YTCAP.maxLines;i++){
    const box = mk('rect',{ rx:3, fill:YTCAP.bg });
    const t   = mk('text',{ 'text-anchor':'middle','dominant-baseline':'central',
      'font-family':'Roboto,Arial,Helvetica,sans-serif','font-size':YTCAP.fontSize,
      'font-weight':400, fill:'#ffffff' });
    g.appendChild(box); g.appendChild(t); lines.push({box,t});
  }
  const probe = mk('text',{ 'font-family':'Roboto,Arial,Helvetica,sans-serif',
    'font-size':YTCAP.fontSize, visibility:'hidden' });
  svg.appendChild(probe);
  const wcache = {};
  function width(s){
    if(wcache[s]!=null) return wcache[s];
    probe.textContent = s;
    return (wcache[s] = probe.getComputedTextLength());
  }
  function wrapAt(text, maxW){
    const words = text.split(/\s+/), out = []; let cur = '';
    for(const w of words){
      const next = cur ? cur+' '+w : w;
      if(cur && width(next) > maxW){ out.push(cur); cur = w; } else cur = next;
    }
    if(cur) out.push(cur);
    return out;
  }
  /* narrow the measure until the lines divide evenly, so a cue never
     ends on one orphan word held for seconds */
  function wrap(text){
    let first = null;
    for(const f of [1,0.90,0.82,0.74,0.66]){
      const ls = wrapAt(text, YTCAP.maxWidth*f);
      if(!first) first = ls;
      if(ls.length % YTCAP.maxLines === 0) return ls;
    }
    return first;
  }
  let CAPS = null;
  function build(){
    CAPS = [];
    CUES.forEach(([t0,t1,text])=>{
      const ls = wrap(text), groups = [];
      for(let i=0;i<ls.length;i+=YTCAP.maxLines) groups.push(ls.slice(i,i+YTCAP.maxLines));
      const d = (t1-t0)/groups.length;
      groups.forEach((grp,i)=> CAPS.push([t0+i*d, t0+(i+1)*d, grp]));
    });
  }
  function show(t){
    if(!CAPS) build();
    const c = CAPS.find(x=> t>=x[0] && t<x[1]);
    if(!c){ g.style.opacity = 0; return; }
    g.style.opacity = 1;
    const grp = c[2], lh = YTCAP.fontSize*YTCAP.lineGap;
    lines.forEach((ln,i)=>{
      const str = grp[i];
      if(str==null){ ln.box.setAttribute('opacity',0); ln.t.setAttribute('opacity',0); return; }
      ln.box.setAttribute('opacity',1); ln.t.setAttribute('opacity',1);
      const cy = YTCAP.blockBottom - (grp.length-1-i)*lh - lh/2;
      const w = width(str);
      ln.t.setAttribute('x',960); ln.t.setAttribute('y',cy); ln.t.textContent = str;
      ln.box.setAttribute('x', 960 - w/2 - YTCAP.pad.x);
      ln.box.setAttribute('y', cy - lh/2 + 1);
      ln.box.setAttribute('width',  w + YTCAP.pad.x*2);
      ln.box.setAttribute('height', lh - 2);
    });
  }
  return { show, build };
})();

/* Scenes are opaque and stacked in order, so a cross-dissolve is the
   incoming scene fading in ON TOP — fading both would dip to black. */
function sceneAlpha(sc, t){
  const x = TL.xfade, lastSc = sc.t1 >= TL.total;
  if(t < sc.t0 - x) return 0;
  if(!lastSc && t >= sc.t1) return 0;
  return sc.t0 === 0 ? 1 : cl((t - (sc.t0 - x)) / x, 0, 1);
}

function render(t){
  let active = null;
  TL.scenes.forEach(sc=>{
    const a = sceneAlpha(sc, t), g = SC[sc.id].g;
    if(a<=0){ g.classList.remove('on'); g.style.opacity = 0; return; }
    g.classList.add('on'); g.style.opacity = a;
    ANIM[sc.id](cl(t - sc.t0, 0, sc.t1 - sc.t0), sc.t1 - sc.t0);
    if(t>=sc.t0 && t<sc.t1) active = sc;
  });
  if(!active) active = TL.scenes[TL.scenes.length-1];
  namesEl.textContent = active.id + ' · ' + active.name;
  CAPL.show(t);
  tc.textContent = t.toFixed(2) + ' / ' + TL.total.toFixed(2);
  scrub.value = Math.round(t / TL.total * 1000);
}

function loop(ts){
  if(playing){
    if(!last) last = ts;
    T += (ts - last)/1000 * parseFloat(document.getElementById('spd').value);
    last = ts;
    if(T >= TL.total){ T = TL.total; playing = false; document.getElementById('play').textContent = 'Replay'; }
    render(T);
  } else last = 0;
  requestAnimationFrame(loop);
}
function setPlay(v){
  if(v && T >= TL.total) T = 0;
  playing = v; last = 0;
  document.getElementById('play').textContent = playing ? 'Pause' : (T>=TL.total ? 'Replay' : 'Play');
}
document.getElementById('play').onclick = ()=> setPlay(!playing);
scrub.oninput = e => { T = e.target.value/1000*TL.total; render(T); setPlay(false); };
document.getElementById('cleanb').onclick = ()=>{ document.body.classList.toggle('clean'); fit(); };
document.getElementById('subsb').onclick  = ()=>{ document.body.classList.toggle('nosubs'); };

addEventListener('keydown', e=>{
  const step = e.shiftKey ? 1 : 0.1;
  if(e.code==='Space'){ e.preventDefault(); setPlay(!playing); }
  else if(e.key==='ArrowRight'){ T = cl(T+step,0,TL.total); render(T); setPlay(false); }
  else if(e.key==='ArrowLeft'){  T = cl(T-step,0,TL.total); render(T); setPlay(false); }
  else if(e.key==='Home'){ T = 0; render(T); setPlay(false); }
  else if(e.key==='s'||e.key==='S'){ document.body.classList.toggle('nosubs'); }
  else if(e.key==='c'||e.key==='C'){ document.body.classList.toggle('clean'); fit(); }
  else if(e.key==='Escape'){ document.body.classList.remove('clean'); fit(); }
});

/* Fit the frame into the viewport, reserving a strip for the control
   bar. The captions sit inside the frame, so nothing else is needed. */
const stage = document.getElementById('stage');
function fit(){
  const clean = document.body.classList.contains('clean');
  const barH  = clean ? 0 : (document.getElementById('bar').offsetHeight + 28);
  const avail = Math.max(120, innerHeight - barH);
  const k = Math.min(innerWidth/1920, avail/1080);
  stage.style.top = (avail/2) + 'px';
  stage.style.transform = `translate(-50%,-50%) scale(${k})`;
}
addEventListener('resize', fit);

function start(){ CAPL.build(); fit(); render(0); requestAnimationFrame(loop); }
if(document.fonts && document.fonts.ready) document.fonts.ready.then(start); else addEventListener('load', start);
</script>
</body>
