<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raven Animatic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#0A1015; --plate:#E1E6EA; --app:#EEECE8; --appAlt:#F3F1ED;
  --card:#FFFFFF; --border:#D7D5D1; --line:#D9D9D4;
  --ink:#100E0A; --muted:#54524E; --muted2:#666460; --muted3:#615F5B;
  --chip:#E6EFF9; --navy:#032B52; --grey:#9BA9B8; --green:#44A047;
  --bar:rgba(16,14,10,.11); --barStrong:rgba(16,14,10,.17);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;font-family:Inter,system-ui,-apple-system,sans-serif;overflow:hidden;color:#fff}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{width:1920px;height:1080px;position:relative;transform-origin:center center;overflow:hidden;background:var(--dark)}
.frame{position:absolute;inset:0;opacity:0;visibility:hidden;z-index:1}
.frame.on{visibility:visible}
.abs{position:absolute}
.bar{position:absolute;background:var(--bar);border-radius:999px}
.barD{position:absolute;background:var(--barStrong);border-radius:999px}
.card{position:absolute;background:var(--card);border:1px solid var(--border);border-radius:14px}
.sug{position:absolute;background:var(--app);border:1px solid var(--border);border-radius:12px}
.t{position:absolute;white-space:nowrap;color:var(--ink);letter-spacing:-.01em}
.tw{color:#fff}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

/* controls */
#ui{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;
  background:rgba(12,14,18,.82);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);
  border-radius:999px;padding:10px 18px;font-size:13px;transition:opacity .4s;z-index:50}
#ui.hide{opacity:0;pointer-events:none}
#ui button{background:none;border:0;color:#fff;cursor:pointer;font:inherit;opacity:.75;padding:4px 6px;border-radius:6px}
#ui button:hover{opacity:1;background:rgba(255,255,255,.1)}
#ui button.act{opacity:1;background:rgba(255,255,255,.16)}
#play{width:30px;font-size:15px}
#scrub{width:420px;accent-color:#fff;cursor:pointer}
#tc{font-family:"JetBrains Mono",monospace;font-size:12px;opacity:.8;min-width:96px}
#lbl{font-size:12px;opacity:.55;min-width:190px;text-align:right}

#subs{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);width:1360px;text-align:center;
  pointer-events:none;z-index:30;transition:opacity .25s}
.subRow{display:block}
#subLine{display:inline;font-size:30px;line-height:1.72;font-weight:500;color:#fff;
  background:rgba(10,16,21,.88);padding:9px 22px;border-radius:10px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
#subs.off{opacity:0}
#hint{position:fixed;left:50%;bottom:0;transform:translateX(-50%);height:90px;width:60vw;z-index:40}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="subs"><div class="subRow"><span id="subLine"></span></div></div></div></div>

<div id="ui">
  <button id="play">❚❚</button>
  <input id="scrub" type="range" min="0" max="44" step="0.01" value="0">
  <span id="tc">0.00 / 44.00</span>
  <button class="sp" data-s="0.25">.25×</button>
  <button class="sp" data-s="0.5">.5×</button>
  <button class="sp act" data-s="1">1×</button>
  <button id="subs-t" class="act">subs</button>
  <button id="clean">clean</button>
  <span id="lbl"></span>
</div>
<div id="hint"></div>

<script>
/* ============================================================
   TIMELINE — edit seconds here, nothing else.
   ============================================================ */
const TL = {
  total: 44,
  frames: [
    { id:'01', name:'A bird out of the dark',   t0: 0.0,  t1: 3.0,  bg:'dark'  },
    { id:'02', name:'A blank page',             t0: 3.0,  t1: 7.0,  bg:'light' },
    { id:'03', name:'A page reference',         t0: 7.0,  t1:12.0,  bg:'light' },
    { id:'04', name:'Five streams into one layer', t0:12.0, t1:24.0, bg:'dark' },
    { id:'06', name:'Seventy-four skills',      t0:24.0,  t1:27.0,  bg:'light' },
    { id:'07', name:'Inside a skill',           t0:27.0,  t1:30.0,  bg:'light' },
    { id:'08', name:'Asking in words',          t0:30.0,  t1:34.0,  bg:'light' },
    { id:'09', name:'One skill, the whole team',t0:34.0,  t1:37.0,  bg:'light' },
    { id:'10', name:'Numbers with a trail',     t0:37.0,  t1:41.0,  bg:'light' },
    { id:'11', name:'Partner in credit',        t0:41.0,  t1:44.0,  bg:'dark'  }
  ],
  xfade: 0.45   // cross-fade length between frames
};


/* ---- VO cues: [in, out, text] — the subtitle band is a review aid, not part of the film ---- */
const CUES = [
  [ 0.0,  3.0, 'Raven was created with the credit professional in mind.'],
  [ 3.0,  7.0, 'With decades of experience in the credit space, we deeply understand the workflows that are important to your team,'],
  [ 7.0, 12.0, 'and above all, that accuracy is key.'],
  [12.0, 16.4, 'Raven is the data and intelligence layer for corporate credit.'],
  [16.4, 21.3, 'Bringing together deal documents, third-party data, firm conventions, analysis, and audit history'],
  [21.3, 24.0, 'to build intelligence that is available wherever your credit team works.'],
  [24.0, 27.0, 'Built on thousands of prompts,'],
  [27.0, 30.0, 'our agentic framework propels any credit team further'],
  [30.0, 34.0, 'with deep analysis that you can speak to in natural language.'],
  [34.0, 37.0, 'Our workflows build repeatable sequences for accuracy across your team,'],
  [37.0, 41.0, 'and our audit capability ensures confidence in the numbers being pulled.'],
  [41.0, 44.0, 'Raven — your partner in credit.']
];

/* ===================== engine ===================== */
const S = document.getElementById('stage');
const eo = p => p<=0?0 : p>=1?1 : 1-Math.pow(2,-9*p);                 // expo out
const es = p => p<=0?0 : p>=1?1 : (p<.5? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2);
const cl = (v,a,b)=>Math.min(b,Math.max(a,v));
function seg(t,s,d){ return cl((t-s)/d,0,1); }                        // raw 0..1
function E(t,s,d){ return eo(seg(t,s,d)); }

const BIRD = 'M33.2617 6.31543H38.5947L44.4883 12.6309H32.4189L27.9287 17.4023H34.2441L57.8213 41.2607H19.2266L12.7715 37.752L11.9287 41.2607L4.91211 35.3662V19.0869H0L12.7715 6.31543H9.96387L16.2793 0H27.3672L33.2617 6.31543ZM24.7002 5.05273C23.6803 5.05279 22.8535 5.87953 22.8535 6.89941C22.8536 7.9192 23.6804 8.74604 24.7002 8.74609C25.72 8.74609 26.5468 7.91923 26.5469 6.89941C26.5469 5.8795 25.7201 5.05273 24.7002 5.05273Z';

function el(tag, cls, css, html){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(css) Object.assign(n.style, css);
  if(html!=null) n.innerHTML = html;
  return n;
}
const UNITLESS = {lineHeight:1, opacity:1, zIndex:1, fontWeight:1, flexGrow:1};
function px(o){ const r={}; for(const k in o){ r[k] = (typeof o[k]==='number' && !UNITLESS[k]) ? o[k]+'px' : o[k]; } return r; }
function box(parent, cls, x,y,w,h, extra){
  const n = el('div', cls, px(Object.assign({left:x,top:y,width:w,height:h}, extra||{})));
  parent.appendChild(n); return n;
}
function txt(parent, x,y, size, color, weight, str, extra){
  const n = el('div','t', px(Object.assign({left:x,top:y,fontSize:size,color:color,fontWeight:weight,lineHeight:1.18},extra||{})), str);
  parent.appendChild(n); return n;
}
function birdSVG(x,y,w,fill){
  const h = w*42/58;
  const s = el('div','abs', px({left:x,top:y,width:w,height:h}));
  s.innerHTML = `<svg viewBox="0 0 58 42" preserveAspectRatio="xMidYMid meet"><path d="${BIRD}" fill="${fill}" fill-rule="evenodd"/></svg>`;
  return s;
}

const ICONS = {
  clip:'<path d="M14.5 6.5l-6 6a2.5 2.5 0 1 0 3.5 3.5l6-6a4.5 4.5 0 1 0-6.4-6.4l-6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
  globe:'<circle cx="10" cy="10" r="7.2" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="10" cy="10" rx="3.2" ry="7.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 10h14" stroke="currentColor" stroke-width="1.4"/>',
  grid:'<rect x="2.6" y="2.6" width="6" height="6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="11.4" y="2.6" width="6" height="6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="2.6" y="11.4" width="6" height="6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="11.4" y="11.4" width="6" height="6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.5"/>',
  file:'<path d="M4.5 2.5h6.2L15.5 7v10.5h-11z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10.6 2.6V7h4.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
  folder:'<path d="M2.5 5.4a1.4 1.4 0 0 1 1.4-1.4h3.4l1.8 2h7a1.4 1.4 0 0 1 1.4 1.4v7.8a1.4 1.4 0 0 1-1.4 1.4H3.9a1.4 1.4 0 0 1-1.4-1.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
  clock:'<circle cx="10" cy="10" r="7.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 5.6V10l3 1.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
  wave:'<path d="M2.5 13l3.2-6.6L9 15l3.2-9.6L15 13l2.5-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
  book:'<path d="M2.6 4.2h5.2c1.2 0 2.2.9 2.2 2v9.6c0-.9-1-1.6-2.2-1.6H2.6zM17.4 4.2h-5.2c-1.2 0-2.2.9-2.2 2v9.6c0-.9 1-1.6 2.2-1.6h5.2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
  search:'<circle cx="8.6" cy="8.6" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  spark:'<path d="M10 2.2l1.9 5.9 5.9 1.9-5.9 1.9L10 17.8l-1.9-5.9L2.2 10l5.9-1.9z" fill="currentColor"/>'
};
function icon(parent,name,x,y,size,color,op){
  const n = el('div','abs', px({left:x,top:y,width:size,height:size,color:color,opacity:op==null?.72:op}));
  n.innerHTML = `<svg viewBox="0 0 20 20" style="width:100%;height:100%;display:block">${ICONS[name]}</svg>`;
  parent.appendChild(n); return n;
}

function svgLayer(parent){
  const ns='http://www.w3.org/2000/svg';
  const s=document.createElementNS(ns,'svg');
  s.setAttribute('viewBox','0 0 1920 1080');
  s.setAttribute('preserveAspectRatio','none');
  parent.appendChild(s); return s;
}
function path(svg,d,stroke,w,extra){
  const ns='http://www.w3.org/2000/svg';
  const p=document.createElementNS(ns,'path');
  p.setAttribute('d',d); p.setAttribute('fill','none');
  p.setAttribute('stroke',stroke); p.setAttribute('stroke-width',w);
  p.setAttribute('pathLength','1');
  if(extra) for(const k in extra) p.setAttribute(k,extra[k]);
  svg.appendChild(p); return p;
}
function draw(p, amount){ p.style.strokeDasharray='1'; p.style.strokeDashoffset = (1-cl(amount,0,1)); }

/* broken grid marks used on the dark frames */
function gridMarks(root, marks){
  marks.forEach(m=>{
    box(root,'abs',m[0],m[1],m[2],m[3],{background:'rgba(255,255,255,.055)'});
  });
  // faint full grid
  for(let x=160;x<1920;x+=320) box(root,'abs',x,0,1,1080,{background:'rgba(255,255,255,.028)'});
  for(let y=270;y<1080;y+=270) box(root,'abs',0,y,1920,1,{background:'rgba(255,255,255,.016)'});
}

/* ===================== frames ===================== */
const BUILD = {};

/* ---- 01 : bird out of the dark ---- */
BUILD['01'] = root=>{
  root.style.background='var(--dark)';
  const g = box(root,'abs',0,0,1920,1080);
  gridMarks(g,[[320,0,2,140],[1600,320,2,200],[0,800,220,2],[1280,160,300,2],[640,920,2,160]]);
  const b = birdSVG(767,400,385,'#ffffff'); root.appendChild(b);
  return lt=>{
    const a = E(lt,0.05,1.3);
    g.style.opacity = E(lt,0,0.9)*0.9;
    b.style.opacity = a;
    b.style.filter = `blur(${(1-a)*22}px)`;
    b.style.transform = `scale(${1.10-0.10*a})`;
  };
};

/* ---- 02 : a blank page ---- */
BUILD['02'] = root=>{
  root.style.background='var(--app)';
  // sidebar
  const sb = box(root,'abs',0,0,263,1080,{background:'var(--card)'});
  box(sb,'abs',262,0,1,1080,{background:'#E1E1E1'});
  sb.appendChild(birdSVG(16,21,41,'#100E0A'));
  box(sb,'bar',67,29,92,17);
  box(sb,'abs',12,132,238,42,{background:'var(--chip)',borderRadius:'10px'});
  box(sb,'abs',60,147,112,12,{background:'var(--navy)',borderRadius:'999px',opacity:.9});
  [[60,193,104],[60,239,92],[60,285,52],[60,331,74]].forEach(b=>box(sb,'bar',b[0],b[1],b[2],12));
  // topbar
  const tb = box(root,'abs',263,0,1657,62,{background:'var(--card)'});
  box(tb,'abs',0,61,1657,1,{background:'#E1E1E1'});
  box(tb,'bar',32,23,142,16);
  // centre mark
  const ctr = box(root,'abs',0,0,1920,1080);
  ctr.appendChild(birdSVG(932,282,66,'rgba(16,14,10,.78)'));
  box(ctr,'barD',1014,293,238,26);
  box(ctr,'bar',970,357,244,16);
  box(ctr,'bar',874,396,436,10);
  // composer
  const comp = box(root,'card',587,503,1009,123,{borderRadius:'16px',boxShadow:'0 18px 48px rgba(16,14,10,.10)'});
  txt(comp,21,21,18,'var(--ink)',400,'Ask about any deal, or type / for a skill');
  txt(comp,88,81,16,'var(--ink)',400,'Web');
  txt(comp,171,81,16,'var(--ink)',400,'Skills');
  icon(comp,'clip',20,79,19,'var(--ink)',.72);
  icon(comp,'globe',64,79,19,'var(--ink)',.72);
  icon(comp,'grid',146,79,19,'var(--ink)',.72);
  const send = box(comp,'abs',953,72,36,36,{background:'var(--grey)',borderRadius:'50%'});
  send.innerHTML='<svg viewBox="0 0 36 36"><path d="M18 24V12M12.5 17.5L18 12l5.5 5.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';
  // suggestions
  const sug=[];
  [[587,649,[[25,20,251],[25,42,215]]],[1098,649,[[25,20,368]]],[587,740,[[25,20,318],[25,42,202]]],[1098,740,[[25,20,395]]]]
  .forEach(c=>{ const n=box(root,'sug',c[0],c[1],498,78); c[2].forEach(b=>box(n,'bar',b[0],b[1],b[2],10)); sug.push(n); });

  return lt=>{
    const chrome = E(lt,0,0.55);
    sb.style.opacity = chrome; tb.style.opacity = chrome;
    sb.style.transform = `translateX(${-24*(1-chrome)}px)`;
    const c2 = E(lt,0.25,0.7);
    ctr.style.opacity = c2*0.95;
    const c3 = E(lt,0.45,0.8);
    comp.style.opacity = c3;
    comp.style.transform = `translateY(${26*(1-c3)}px)`;
    sug.forEach((n,i)=>{ const p=E(lt,0.95+i*0.11,0.6); n.style.opacity=p; n.style.transform=`translateY(${16*(1-p)}px)`; });
  };
};

/* ---- 03 : a page reference ---- */
BUILD['03'] = root=>{
  root.style.background='var(--app)';
  const tbl = box(root,'abs',0,0,1920,1080);
  // faint bottom edge of a table
  [[360,300,440],[360,340,300],[360,380,380]].forEach((b,i)=>{
    box(tbl,'bar',b[0],b[1],b[2],13);
    box(tbl,'bar',1180,b[1],92,13);
    box(tbl,'bar',1420,b[1],78,13);
  });
  box(tbl,'abs',360,268,1140,1,{background:'var(--line)'});
  box(tbl,'abs',360,418,1140,1,{background:'var(--line)'});
  tbl.style.filter='blur(2.2px)';
  const line = txt(root,360,563,36,'var(--ink)',400,'Source: Project Titan — LP (Public), p. 10');
  return lt=>{
    const a=E(lt,0,0.9);
    tbl.style.opacity = a*0.5;
    const b=E(lt,0.55,1.1);
    line.style.opacity=b;
    line.style.transform=`translateY(${14*(1-b)}px) scale(${0.985+0.015*b})`;
    const push = E(lt,0,4.6);
    root.style.transform = `scale(${1+0.018*push})`;
  };
};

/* ---- 04 : five streams into one layer ---- */
BUILD['04'] = root=>{
  root.style.background='var(--dark)';
  const g = box(root,'abs',0,0,1920,1080);
  gridMarks(g,[[160,0,2,120],[1760,480,2,280],[0,640,180,2],[1440,960,480,2]]);

  const SRC = [
    [288,'Deal documents','Credit agreements, LPs, term she…'],
    [561,'Third-party data','Market and reference data from …'],
    [834,'Firm conventions','How your desk defines leverage, …'],
    [1107,'Analysis','Every model run and screen alre…'],
    [1380,'Audit history','Who pulled which figure, from w…']
  ];
  const srcEls = SRC.map(s=>{
    const n = box(root,'abs',s[0],158,260,70);
    txt(n,0,0,22,'#fff',600,s[1]);
    txt(n,0,34,15,'rgba(255,255,255,.55)',400,s[2],{whiteSpace:'normal',width:'252px'});
    return n;
  });

  const sv = svgLayer(root);
  const LINE='rgba(255,255,255,.52)';   // base curve colour
  const LW  = 2.4;                      // base curve width
  const FW  = 3.4;                      // travelling-pulse width
  const inC = [
    'M413 236 C413 346, 960 356, 960 410',
    'M686 236 C686 346, 960 356, 960 410',
    'M960 236 L960 410',
    'M1232 236 C1232 346, 960 356, 960 410',
    'M1505 236 C1505 346, 960 356, 960 410'
  ].map(d=>path(sv,d,LINE,LW));
  const outC = [
    'M960 710 C960 766, 544 780, 544 840',
    'M960 710 L960 840',
    'M960 710 C960 766, 1376 780, 1376 840'
  ].map(d=>path(sv,d,LINE,LW));
  const flow = [...inC,...outC].map(p=>{
    const q = path(sv, p.getAttribute('d'), '#ffffff', FW, {'stroke-linecap':'round'});
    q.style.strokeDasharray='0.11 0.89';
    q.style.filter='drop-shadow(0 0 7px rgba(255,255,255,.5))';
    return q;
  });

  const plate = box(root,'abs',480,410,960,300,{background:'var(--plate)',transformOrigin:'50% 0%'});
  const pTitle = txt(root,528,488,44,'var(--dark)',600,'The intelligence layer');
  const pBody  = txt(root,528,560,19,'rgba(10,16,21,.78)',400,
    'Deal documents, third-party data, firm conventions, analysis and audit history, held as<br>one source your team works from.',{whiteSpace:'normal',lineHeight:1.55});

  const OUT=[[544,'Underwriting'],[960,'Monitoring'],[1376,'Agent']];
  const outEls = OUT.map(o=>{
    const n = txt(root,0,854,22,'#fff',500,o[1],{left:o[0]+'px',transform:'translateX(-50%)'});
    n.dataset.x=o[0]; return n;
  });

  /* --- beats of frame 04, seconds from its own start --- */
  const B = {
    grid:      [0.00, 0.35],   // [start, duration]
    srcStart:   0.30, srcStep: 0.13, srcDur: 0.50,
    curveStart: 1.20, curveStep:0.09, curveDur: 0.85,
    plate:     [2.35, 0.55],
    title:     [2.80, 0.50],
    body:      [3.00, 0.55],
    outCurve:  [3.45, 1.00],
    outLabel:   4.45, outStep: 0.11, outDur: 0.45,
    flow:       5.10
  };
  return lt=>{
    g.style.opacity = E(lt,B.grid[0],B.grid[1]);
    srcEls.forEach((n,i)=>{ const p=E(lt,B.srcStart+i*B.srcStep,B.srcDur);
      n.style.opacity=p; n.style.transform=`translateY(${14*(1-p)}px)`; });
    inC.forEach((p,i)=> draw(p, es(seg(lt,B.curveStart+i*B.curveStep,B.curveDur))));
    const gp = E(lt,B.plate[0],B.plate[1]);
    plate.style.opacity = gp>0?1:0;
    plate.style.transform = `scaleY(${0.02+0.98*gp})`;
    const tp = E(lt,B.title[0],B.title[1]), bp = E(lt,B.body[0],B.body[1]);
    pTitle.style.opacity=tp; pTitle.style.transform=`translateY(${10*(1-tp)}px)`;
    pBody.style.opacity=bp*0.95; pBody.style.transform=`translateY(${10*(1-bp)}px)`;
    outC.forEach(p=> draw(p, es(seg(lt,B.outCurve[0],B.outCurve[1]))));

/* ===================== assemble ===================== */
const scenes = TL.frames.map(f=>{
  const root = el('div','frame');
  S.appendChild(root);
  const upd = BUILD[f.id](root);
  return Object.assign({}, f, {root, upd});
});

function mix(a,b,p){
  const pa=[10,16,21], pb=[238,236,232];
  const c = a==='dark'?pa:pb, d = b==='dark'?pa:pb;
  return `rgb(${c.map((v,i)=>Math.round(v+(d[i]-v)*p)).join(',')})`;
}

let t=0, playing=true, speed=1, last=performance.now();
function render(){
  // background interpolation across the cut
  let bg = scenes[0].bg;
  for(let i=0;i<scenes.length;i++){
    const s=scenes[i];
    if(t>=s.t0 && t<s.t1){
      const nxt = scenes[i+1];
      const toEnd = s.t1-t;
      if(nxt && toEnd < TL.xfade) bg = mix(s.bg, nxt.bg, 1-toEnd/TL.xfade);
      else bg = mix(s.bg, s.bg, 0);
      break;
    }
  }
  S.style.background = bg;

  scenes.forEach(s=>{
    const fin  = cl((t-s.t0)/TL.xfade,0,1);
    const fout = cl((s.t1-t)/TL.xfade,0,1);
    const vis = t > s.t0-TL.xfade && t < s.t1+0.05;
    s.root.classList.toggle('on', vis);
    if(!vis){ s.root.style.opacity=0; return; }
    s.root.style.opacity = Math.min(fin,fout);
    s.upd(cl(t-s.t0,0,s.t1-s.t0));
  });

  const cur = scenes.find(s=>t>=s.t0 && t<s.t1) || scenes[scenes.length-1];
  lbl.textContent = cur.id+' · '+cur.name;

  const cue = CUES.find(c=>t>=c[0] && t<c[1]);
  subLine.textContent = cue ? cue[2] : '';
  subLine.parentElement.style.visibility = cue ? 'visible' : 'hidden';
  tc.textContent = t.toFixed(2)+' / '+TL.total.toFixed(2);
  if(document.activeElement!==scrub) scrub.value = t;
}
function loop(now){
  const dt=(now-last)/1000; last=now;
  if(playing){ t+=dt*speed; if(t>=TL.total) t=0; }
  render(); requestAnimationFrame(loop);
}

/* fit */
function fit(){
  const k = Math.min(innerWidth/1920, innerHeight/1080);
  S.style.transform = `scale(${k})`;
}
addEventListener('resize', fit); fit();

/* controls */
const play=document.getElementById('play'), scrub=document.getElementById('scrub'),
      tc=document.getElementById('tc'), lbl=document.getElementById('lbl'),
      ui=document.getElementById('ui'), clean=document.getElementById('clean');
play.onclick=()=>{ playing=!playing; play.textContent = playing?'❚❚':'▶'; };
scrub.oninput=()=>{ t=parseFloat(scrub.value); };
document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{
  speed=parseFloat(b.dataset.s);
  document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('act',x===b));
});
const subsBox=document.getElementById('subs'),
      subLine=document.getElementById('subLine'), subsT=document.getElementById('subs-t');
let subsOn=true;
subsT.onclick=()=>{ subsOn=!subsOn; subsBox.classList.toggle('off',!subsOn); subsT.classList.toggle('act',subsOn); };
let cleanMode=false;
clean.onclick=()=>{ cleanMode=!cleanMode; ui.classList.toggle('hide',cleanMode); };
let hideT;
function poke(){ if(cleanMode) return; ui.classList.remove('hide'); clearTimeout(hideT);
  hideT=setTimeout(()=>ui.classList.add('hide'),3000); }
addEventListener('mousemove',poke); poke();
addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); play.click(); }
  if(e.code==='ArrowRight'){ t=Math.min(TL.total,t+(e.shiftKey?1:0.1)); }
  if(e.code==='ArrowLeft'){ t=Math.max(0,t-(e.shiftKey?1:0.1)); }
  if(e.code==='KeyC'){ clean.click(); }
  if(e.code==='KeyS'){ subsT.click(); }
  if(e.code==='Home'){ t=0; }
});
requestAnimationFrame(loop);
</script>
