<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raven Shorts 1 — animatic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ui:#d8dadd; --uibg:rgba(16,18,21,.86); --uiline:rgba(255,255,255,.16); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{font-family:Commissioner,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}

  /* stage: absolute + translate centering — survives being wider than the viewport */
  #wrap{position:fixed;inset:0;overflow:hidden;background:#000}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;will-change:transform}
  #stage svg{display:block;width:1920px;height:1080px}
  #shade{position:fixed;left:0;right:0;bottom:0;height:0;pointer-events:none}

  .scene{opacity:0;visibility:hidden}
  .scene.on{visibility:visible}

  /* Subtitle band — a review aid, not part of the film. It lives OUTSIDE the
     1920x1080 stage and the stage is scaled to leave room for it, so it can
     never cover the frame. In clean mode it is gone and the stage fills. */
  #cap{position:fixed;left:0;right:0;text-align:center;pointer-events:none;padding:0 16px;z-index:8}
  #cap span{display:inline-block;max-width:min(1100px,94vw);
    font-size:clamp(13px,1.45vw,21px);line-height:1.4;color:#e9eaec;
    padding:2px 4px;opacity:0;transition:opacity .18s}
  body.clean #cap,body.nosubs #cap{display:none}

  /* controls */
  #bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
    z-index:9;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
    max-width:calc(100vw - 20px);padding:9px 12px;background:var(--uibg);border:1px solid var(--uiline);
    border-radius:12px;color:var(--ui);font-size:13px;backdrop-filter:blur(8px)}
  body.clean #bar{display:none}
  #bar button,#bar select{font:inherit;font-family:inherit;color:var(--ui);background:transparent;
    border:1px solid var(--uiline);border-radius:8px;padding:5px 11px;cursor:pointer}
  #bar button:hover,#bar select:hover{border-color:rgba(255,255,255,.4)}
  #bar input[type=range]{width:min(44vw,420px);accent-color:#fff}
  #tc{font-family:"IBM Plex Mono",monospace;font-size:12px;min-width:92px;text-align:center;opacity:.85}
  #names{font-size:12px;opacity:.6;min-width:170px;text-align:center}
  .hint{font-size:11px;opacity:.5;width:100%;text-align:center}
  @media (max-width:760px){ #names{display:none} .hint{display:none} #bar{gap:7px;padding:7px 9px} }
</style>
</head>

<div id="wrap">

    <svg id="svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision"></svg>
  </div>
  <div id="cap"><span id="capt"></span></div>
</div>

<div id="bar">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1">
  <span id="tc">0.00 / 42.00</span>
  <select id="spd">
    <option value="0.25">0.25x</option>
    <option value="0.5">0.5x</option>
    <option value="1" selected>1x</option>
  </select>
  <button id="subsb">Subs</button>
  <button id="cleanb">Clean</button>
  <span id="names"></span>
  <span class="hint">Space — play/pause · ← → — 0.1s (Shift: 1s) · Home — start · S — subtitles · C — clean mode (Esc to exit)</span>
</div>

    const e = mk('path',{ d:n.d, fill: n.fill==='none'||!n.fill ? 'none' : col(n.fill),
      stroke: n.stroke?col(n.stroke):null, 'stroke-width': n.strokeWidth||0,
      'stroke-linecap':'round', 'stroke-linejoin':'round' });
    if(n.opacity!=null) e.setAttribute('opacity', n.opacity);
    return e;
  }
  if(n.type==='text'){
    const e = mk('text',{ x:n.x, y:n.y,
      'text-anchor': ANCHOR[n.align]||'start',
      'dominant-baseline': BASELINE[n.baseline]||'text-before-edge' });
    applyType(e, n.style);
    e.textContent = n.value==null ? '' : n.value;
    return e;
  }
  if(n.type==='image' && n.ref==='bird'){
    const g  = mk('g');
    const vb = SPEC.bird.viewBox.split(/\s+/).map(Number);
    const sx = n.w/vb[2], sy = n.h/vb[3];
    g.setAttribute('transform', `translate(${n.x} ${n.y}) scale(${sx} ${sy}) translate(${-vb[0]} ${-vb[1]})`);
    const p = mk('path',{ d: SPEC.bird.d, fill: col(n.fill) });
    g.appendChild(p);
    if(n.opacity!=null) g.setAttribute('opacity', n.opacity);
    return g;
  }
  return mk('g');
}

function gridFor(frame){
  const g = mk('g');
  if(!frame.grid) return g;
  const {step, color, opacity} = frame.grid;
  for(let x=step; x<1920; x+=step) g.appendChild(mk('line',{x1:x,y1:0,x2:x,y2:1080,stroke:col(color),'stroke-width':1,opacity:opacity??1}));
  for(let y=step; y<1080; y+=step) g.appendChild(mk('line',{x1:0,y1:y,x2:1920,y2:y,stroke:col(color),'stroke-width':1,opacity:opacity??1}));
  return g;
}

const F = id => SPEC.frames.find(f=>f.id===id);

/* table → elements, grouped by row key */
function buildTable(tbl, parent){
  const colOf = {}; tbl.columns.forEach(c=>colOf[c.key]=c);
  const rowOf = {}; tbl.rows.forEach(r=>rowOf[r.key]=r);
  const byRow = {};
  tbl.cells.forEach(c=>{
    if(c.value==null || !c.style) return;
    const cc = colOf[c.col], rr = rowOf[c.row]; if(!cc||!rr) return;
    const x = c.align==='left' ? cc.x : (c.align==='center' ? cc.x+cc.w/2 : cc.anchorX);
    const e = mk('text',{ x, y: rr.y + rr.h/2,
      'text-anchor': ANCHOR[c.align]||'start', 'dominant-baseline':'central' });
    applyType(e, c.style);
    e.textContent = c.value;
    parent.appendChild(e);
    (byRow[c.row] = byRow[c.row]||[]).push(e);
    e.__cell = c;
  });
  return byRow;
}

/* ===================== scene builders ===================== */
const SC = {};   // id -> { g, ...refs }

function sceneG(frame){
  const g = mk('g',{class:'scene'});
  g.appendChild(mk('rect',{x:0,y:0,width:1920,height:1080,fill:col(frame.bg)}));
  g.appendChild(gridFor(frame));
  svg.appendChild(g);
  return g;
}

function tr(el,s){ el.setAttribute('transform', s); }

function dash(el, p){                      // draw a path / line 0..1
  if(el.__len==null){
    try{ el.__len = el.getTotalLength(); }catch(e){ el.__len = 0; }
  }
  const L = el.__len || 0;
  el.setAttribute('stroke-dasharray', L);
  el.setAttribute('stroke-dashoffset', L*(1-p));
}

function typeInto(el, full, p){
  const n = Math.round(full.length * p);
  el.textContent = full.slice(0, n);
}

/* ===================== playback ===================== */
let T = 0, playing = false, last = 0;
const scrub = document.getElementById('scrub');
const tc    = document.getElementById('tc');
const namesEl = document.getElementById('names');
const capt  = document.getElementById('capt');

/* Scenes are opaque, full-bleed and stacked in order, so a cross-dissolve is
   just the incoming scene fading in ON TOP of the outgoing one. Fading both at
   once would dip to black through the gap. */
function sceneAlpha(sc, t){
  const x = TL.xfade;
  const last = sc.t1 >= TL.total;
  if(t < sc.t0 - x) return 0;
  if(!last && t >= sc.t1) return 0;          // fully covered by the next scene
  return sc.t0 === 0 ? 1 : cl((t - (sc.t0 - x)) / x, 0, 1);
}

function render(t){
  let active = null;
  TL.scenes.forEach(sc=>{
    const a = sceneAlpha(sc, t);
    const g = SC[sc.id].g;
    if(a<=0){ g.classList.remove('on'); g.style.opacity = 0; return; }
    g.classList.add('on'); g.style.opacity = a;
    const lt = cl(t - sc.t0, 0, sc.t1 - sc.t0);
    ANIM[sc.id](lt, sc.t1 - sc.t0);
    if(t>=sc.t0 && t<sc.t1) active = sc;
  });
  if(!active) active = TL.scenes[TL.scenes.length-1];
  namesEl.textContent = active.id + ' · ' + active.name;

  const cue = CUES.find(c=> t>=c[0] && t<c[1]);
  if(cue){ capt.textContent = cue[2]; capt.style.opacity = 1; } else { capt.style.opacity = 0; }

  tc.textContent = t.toFixed(2) + ' / ' + TL.total.toFixed(2);
  scrub.value = Math.round(t / TL.total * 1000);
}

function loop(ts){
  if(playing){
    if(!last) last = ts;
    const dt = (ts - last) / 1000 * parseFloat(document.getElementById('spd').value);
    last = ts;
    T += dt;
    if(T >= TL.total){ T = TL.total; playing = false; document.getElementById('play').textContent = 'Replay'; }
    render(T);
  }else last = 0;
  requestAnimationFrame(loop);
}

function setPlay(v){
  if(v && T >= TL.total) T = 0;
  playing = v; last = 0;
  document.getElementById('play').textContent = playing ? 'Pause' : (T>=TL.total ? 'Replay' : 'Play');
}
document.getElementById('play').onclick = ()=> setPlay(!playing);
scrub.oninput = e => { T = e.target.value/1000*TL.total; render(T); setPlay(false); };
document.getElementById('cleanb').onclick = ()=>{ document.body.classList.toggle('clean'); fit(); };
document.getElementById('subsb').onclick  = ()=>{ document.body.classList.toggle('nosubs'); fit(); };

addEventListener('keydown', e=>{
  const step = e.shiftKey ? 1 : 0.1;
  if(e.code==='Space'){ e.preventDefault(); setPlay(!playing); }
  else if(e.key==='ArrowRight'){ T = cl(T+step,0,TL.total); render(T); setPlay(false); }
  else if(e.key==='ArrowLeft'){  T = cl(T-step,0,TL.total); render(T); setPlay(false); }
  else if(e.key==='Home'){ T = 0; render(T); setPlay(false); }
  else if(e.key==='s'||e.key==='S'){ document.body.classList.toggle('nosubs'); fit(); }
  else if(e.key==='c'||e.key==='C'){ document.body.classList.toggle('clean'); fit(); }
  else if(e.key==='Escape'){ document.body.classList.remove('clean'); fit(); }
});

/* Fit the 1920×1080 stage into the viewport, reserving a strip underneath for
   the control bar and the subtitle band so neither ever sits over the frame. */
const stage = document.getElementById('stage');
const capEl = document.getElementById('cap');
function fit(){
  const clean = document.body.classList.contains('clean');
  const subs  = !clean && !document.body.classList.contains('nosubs');
  const barH  = clean ? 0 : (document.getElementById('bar').offsetHeight + 34);
  const capH  = subs ? Math.round(Math.min(96, Math.max(54, innerHeight*0.085))) : 0;
  const reserve = barH + capH;

  const avail = Math.max(120, innerHeight - reserve);
  const k = Math.min(innerWidth/1920, avail/1080);
  stage.style.top = (avail/2) + 'px';
  stage.style.transform = `translate(-50%,-50%) scale(${k})`;
  // sit the band just under the frame when the viewport leaves slack above the
  // control bar (portrait phones), otherwise in the reserved strip
  const stageBottom = avail/2 + (1080*k)/2;
  const stripTop    = innerHeight - barH - capH;
  capEl.style.top    = Math.min(stageBottom + 10, stripTop) + 'px';
  capEl.style.bottom = 'auto';
  capEl.style.height = capH + 'px';
  capEl.style.display = subs ? 'flex' : 'none';
  capEl.style.alignItems = 'center';
  capEl.style.justifyContent = 'center';
}
addEventListener('resize', fit);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
fit();

/* fonts settle before the pill row is measured */
function start(){ SC['02'].layout(); fit(); render(0); requestAnimationFrame(loop); }
if(document.fonts && document.fonts.ready) document.fonts.ready.then(start); else addEventListener('load', start);
</script>
